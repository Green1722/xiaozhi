<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小智体检记录</title>
<style>
body{font:16px/1.6 system-ui,sans-serif;color:#192b3b;background:#f5f7fa;margin:0}main{max-width:1100px;margin:40px auto;padding:24px}h1{font-size:30px}input,button{box-sizing:border-box;font:inherit;padding:9px 14px;border:1px solid #b8c4d1;border-radius:6px}button{background:#145b87;color:white;cursor:pointer}.filters{display:flex;gap:16px;align-items:end;flex-wrap:wrap}.filters label{display:flex;flex-direction:column;gap:6px}.filters input{width:270px}table{width:100%;min-width:950px;border-collapse:collapse;background:white}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3e9;white-space:nowrap}small{color:#536675}#status{white-space:pre-wrap}#result{white-space:pre-wrap;background:white;padding:20px}.scroll{overflow-x:auto;margin-top:24px}.scrollhint{display:none}@media(max-width:600px){main{margin:12px auto}.filters{display:block}.filters label{margin:16px 0}.filters input{width:100%}.scrollhint{display:block}}
</style><main><h1>小智体检记录</h1>
<p>查看身高、体重、BMI与播报状态，按仪器筛选测量记录。</p>
<section class="filters"><label>访问密钥 <input id="key" type="password" autocomplete="off" placeholder="请输入访问密钥"></label>
<label>仪器编号 <input id="instrument" placeholder="留空查询全部仪器"></label>
<button id="load">查询记录</button></section><p id="status" role="status">请输入访问密钥后查询。</p><small class="scrollhint">左右滑动表格查看全部字段。</small>
<div class="scroll"><table><thead><tr><th>时间</th><th>仪器</th><th>身高 cm</th><th>体重 kg</th><th>BMI</th><th>来源</th><th>播报</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table></div>
<p><small>标为“示例数据”的记录不代表现场测量。“未确认”表示尚未收到播报确认。</small></p><div id="result" hidden></div></main>
<script>
const statusText=document.getElementById('status'), body=document.getElementById('rows');
const labels={unconfirmed:'未确认',requested:'已请求',device_confirmed:'设备已确认',failed:'失败'};
async function api(path, method='GET'){
 const res=await fetch(path,{method,headers:{'X-Health-API-Key':document.getElementById('key').value}});
 if(!res.ok){let msg=await res.json().catch(()=>({}));const errors={401:'访问密钥不正确，请重新输入。',503:'模型服务尚未配置，暂时无法生成AI说明。',502:'模型服务暂时不可用，请稍后重试。'};throw new Error(errors[res.status]||msg.detail||`请求失败 ${res.status}`)}return res.json();
}
document.getElementById('load').onclick=async()=>{
 try{statusText.textContent='正在查询…';let id=document.getElementById('instrument').value;
 const data=await api('/api/exams?limit=100'+(id?'&instrument_id='+encodeURIComponent(id):''));body.replaceChildren();
 for(const row of data.records){let tr=document.createElement('tr');
  for(const value of [new Date(row.measured_at).toLocaleString('zh-CN'),row.instrument_id,row.height_cm,row.weight_kg,row.bmi,row.source==='synthetic'?'示例数据':'测量上报',labels[row.speech_status]||row.speech_status]){let td=document.createElement('td');td.textContent=value;tr.append(td)}
  let td=document.createElement('td'),button=document.createElement('button');button.textContent='AI说明';
  button.onclick=async()=>{button.disabled=true;try{let result=await api('/api/exams/'+encodeURIComponent(row.id)+'/explanation','POST');const out=document.getElementById('result');out.hidden=false;out.textContent='AI生成说明（'+result.model+'）\n'+result.text}catch(e){statusText.textContent=e.message}finally{button.disabled=false}};
  td.append(button);tr.append(td);body.append(tr);
 }statusText.textContent=`已查询 ${data.records.length} 条记录。`;
 }catch(e){statusText.textContent=e.message;body.replaceChildren()}
};
</script></html>
